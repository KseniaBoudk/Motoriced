<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>We are Motorised!</title>
        <link rel="icon" type="image/png" href="images/favicon.png">
        <link rel="stylesheet" href="common.css">
        <link rel="stylesheet" href="contentStyle.css">

    </head>


    <body>
        


        <header class="site-header">

            <!-- left -->
            <a href="index.html" class="logo">motorised</a>

            <!-- middle -->
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="aboutUs.html" class="nav-link">About Us</a>
                <a href="content.html" class="nav-link">Content</a>
                <a href="donate.html" class="nav-link">Donate</a>
                <a href="socials.html" class="nav-link">Socials</a>
            </nav>

            <!-- right -->
            <button class="menu-toggle" aria-label="Open menu">
                <span></span>
                <span></span>
            </button>

        </header>

        <main class="content-page">

            <div class="timeline" aria-label="Process steps">
                <input type="radio" name="step" id="step-1">
                <label for="step-1" class="step">Research</label>

                <input type="radio" name="step" id="step-2">
                <label for="step-2" class="step">Sketch</label>

                <input type="radio" name="step" id="step-3" checked>
                <label for="step-3" class="step">Design</label>

                <input type="radio" name="step" id="step-4">
                <label for="step-4" class="step">Build</label>

                <input type="radio" name="step" id="step-5">
                <label for="step-5" class="step">Test</label>

                <input type="radio" name="step" id="step-6">
                <label for="step-6" class="step">Launch</label>
            </div>

            <section class="timeline-hero">
                <h1>From idea to launch</h1>
                <p>A six-step process for turning rough concepts into finished websites.</p>
            </section>

        </main>

        
        <script type="module" src="background.js"></script>

    </body>
</html>
